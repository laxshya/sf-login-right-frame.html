<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CV360 – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', sans-serif;
      background-color: #00A99D;
      overflow: hidden;
    }
    .page {
      height: 100vh;
      width: 100%;
      background-color: #00A99D;
      display: flex;
      flex-direction: column;
      padding: 48px 20px 0 20px;
      animation: fadeIn 0.6s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .content {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .headline {
      font-size: clamp(24px, 3.2vw, 36px);
      font-weight: 800;
      line-height: 1.15;
      color: #FFFFFF;
      margin-bottom: 20px;
    }
    .body-text {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255,255,255,0.88);
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #00857C;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      max-width: 420px;
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .btn:hover {
      background: #f0fffe;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
    }
    .illustration {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 520px;
      margin: 32px auto 0 auto;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      background: #f5f0e8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .illustration img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
  </style>
</head>
<body>
<div class="page">
  <div class="content">
    <h1 class="headline">
      Explore the NEW Tubing Set Configurator within CV360
    </h1>
    <p class="body-text">
      One unified view, making your daily input faster, smoother, and much easier to manage.
    </p>
    <a class="btn"
       href="https://terumoamericas.sharepoint.com/sites/TCVS/CV360/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2FTCVS%2FCV360%2FShared%20Documents%2FSalesforce%20Training&viewid=38bf3659%2Dd368%2D4a21%2D913b%2D709c60777455"
       target="_blank">
      Access Training Material
    </a>
  </div>
  <div class="illustration">
    <img src="CV360_image for welcome page.png" alt="CV360 Tubing Set Configurator"/>
  </div>
</div>
</body>
</html>
